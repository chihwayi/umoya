# docker-compose.prod.yml — Production deployment
# Usage: docker compose -f docker-compose.prod.yml up -d
# Prerequisites: .env file with all secrets from docs/secrets-checklist.md
# Run `bash scripts/validate-secrets.sh` before deploying.

services:
  postgres-master:
    image: pgvector/pgvector:pg15
    container_name: umoya-postgres-master
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_master_data:/var/lib/postgresql/data
      - ./database/schemas/tenant.sql:/docker-entrypoint-initdb.d/01-tenant.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - umoya-network

  redis:
    image: redis:7-alpine
    container_name: umoya-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-} --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - umoya-network

  minio:
    image: minio/minio:RELEASE.2023-10-07T15-07-38Z
    container_name: umoya-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server --console-address ":9001" /data
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - umoya-network

  tenant-service:
    build:
      context: .
      dockerfile: services/tenant-service/Dockerfile
    image: umoya/tenant-service:${IMAGE_TAG:-latest}
    container_name: umoya-tenant-service
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${SERVICE_POSTGRES_HOST}:5432/${POSTGRES_DB}
      - REDIS_URL=${SERVICE_REDIS_URL}
      - DB_HOST=${SERVICE_POSTGRES_HOST}
      - DB_PORT=5432
      - DB_USERNAME=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - MINIO_URL=${SERVICE_MINIO_URL}
      - BACKUP_BUCKET_NAME=${BACKUP_BUCKET_NAME}
      - MINIO_PUBLIC_URL=${MINIO_PUBLIC_URL}
      - AWS_REGION=${AWS_REGION}
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD}
      - AWS_ENDPOINT=${SERVICE_MINIO_URL}
      - JWT_SECRET=${JWT_SECRET}
      - SERVICE_TENANT_URL=${SERVICE_TENANT_URL}
      - SERVICE_EHR_URL=${SERVICE_EHR_URL}
      - SERVICE_CDSS_URL=${SERVICE_CDSS_URL}
      - CDSS_SERVICE_TOKEN=${CDSS_SERVICE_TOKEN}
      - LLM_API_URL=${LLM_API_URL}
      - SMS_ENABLED=${SMS_ENABLED:-false}
      - AT_API_KEY=${AT_API_KEY:-}
      - AT_USERNAME=${AT_USERNAME:-sandbox}
      - AT_SENDER_ID=${AT_SENDER_ID:-Umoya}
      - PAYMENT_PROVIDER=${PAYMENT_PROVIDER:-}
      - FLW_SECRET_KEY=${FLW_SECRET_KEY:-}
      - FLW_PUBLIC_KEY=${FLW_PUBLIC_KEY:-}
      - FLW_WEBHOOK_SECRET=${FLW_WEBHOOK_SECRET:-}
      - MPESA_CONSUMER_KEY=${MPESA_CONSUMER_KEY:-}
      - MPESA_CONSUMER_SECRET=${MPESA_CONSUMER_SECRET:-}
      - MPESA_SHORTCODE=${MPESA_SHORTCODE:-}
      - MPESA_PASSKEY=${MPESA_PASSKEY:-}
      - MPESA_CALLBACK_URL=${MPESA_CALLBACK_URL:-}
      - MPESA_BASE_URL=${MPESA_BASE_URL:-https://sandbox.safaricom.co.ke}
      - ZIMSWITCH_MERCHANT_ID=${ZIMSWITCH_MERCHANT_ID:-}
      - ZIMSWITCH_API_KEY=${ZIMSWITCH_API_KEY:-}
      - ZIMSWITCH_ENDPOINT=${ZIMSWITCH_ENDPOINT:-https://api.zimswitch.co.zw/v1}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - SUPER_ADMIN_TEST_TENANT_ID=${SUPER_ADMIN_TEST_TENANT_ID:-kids-clinic}
      - DOCKER_SOCKET_PATH=/var/run/docker.sock
    command: sh -lc "npm run build && npm start"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"const http=require('http');const req=http.get('http://localhost:3001/api/auth/profile',res=>process.exit(res.statusCode>=500?1:0));req.on('error',()=>process.exit(1));req.setTimeout(3000,()=>{req.destroy();process.exit(1)});\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgres-master:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - umoya-network

  cdss-service:
    build:
      context: ./services/cdss-service
      dockerfile: Dockerfile.prod
    image: umoya/cdss-service:${IMAGE_TAG:-latest}
    container_name: umoya-cdss-service
    restart: unless-stopped
    environment:
      - ENVIRONMENT=production
      - REDIS_URL=${SERVICE_REDIS_URL}
      - PYTHONUNBUFFERED=1
      - MASTER_DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${SERVICE_POSTGRES_HOST}:5432/${POSTGRES_DB}
      - CDSS_ENABLE_AI=${CDSS_ENABLE_AI:-true}
      - CDSS_REQUIRE_SERVICE_AUTH=true
      - CDSS_SERVICE_AUTH_MODE=${CDSS_SERVICE_AUTH_MODE:-both}
      - CDSS_SERVICE_TOKEN=${CDSS_SERVICE_TOKEN}
      - CDSS_SERVICE_JWT_SECRET=${CDSS_SERVICE_JWT_SECRET}
      - CDSS_SERVICE_AUTH_ISSUER=${CDSS_SERVICE_AUTH_ISSUER:-umoya.ehr-service}
      - CDSS_SERVICE_AUTH_AUDIENCE=${CDSS_SERVICE_AUTH_AUDIENCE:-umoya.cdss}
      - CDSS_SERVICE_AUTH_JWT_REPLAY_STRICT=${CDSS_SERVICE_AUTH_JWT_REPLAY_STRICT:-true}
      - CDSS_PHI_REDACTION_ENABLED=true
      - CDSS_BLOCK_OUTBOUND_PHI=true
      - CDSS_STRICT_EGRESS_ALLOWLIST=true
      - CDSS_ENCRYPTION_ENABLED=true
      - CDSS_ENCRYPTION_PROVIDER=${CDSS_ENCRYPTION_PROVIDER:-local}
      - CDSS_ENCRYPTION_KEY_ID=${CDSS_ENCRYPTION_KEY_ID:-prod-v1}
      - CDSS_ENCRYPTION_KEY=${CDSS_ENCRYPTION_KEY}
      - CDSS_ENCRYPTION_ALLOW_PLAINTEXT_READS=false
      - CDSS_JOB_WORKER_ENABLED=true
      - CDSS_JOB_QUEUE_NAME=${CDSS_JOB_QUEUE_NAME:-cdss:jobs:queue}
      - CDSS_JOB_DLQ_NAME=${CDSS_JOB_DLQ_NAME:-cdss:jobs:dead_letter}
      - CDSS_EGRESS_ALLOWLIST=${CDSS_EGRESS_ALLOWLIST:-}
      - MINIO_ENDPOINT=${SERVICE_MINIO_URL}
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - MINIO_BUCKET=umoya-documents
      - EHR_SERVICE_URL=${SERVICE_EHR_URL}
      - CDSS_USE_EHR_TERMINOLOGY=true
      - JWT_SECRET=${JWT_SECRET}
      - OWNER_EMAILS=${OWNER_EMAILS}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - LLM_ENABLED=${LLM_ENABLED:-true}
      - ANONYMIZED_TELEMETRY=False
      - LLM_API_URL=${LLM_API_URL}
      - LLM_MODEL_NAME=${LLM_MODEL_NAME:-llama3.1:latest}
      - LLM_TIMEOUT_SECONDS=${LLM_TIMEOUT_SECONDS:-60}
      - LLM_MAX_RETRIES=2
      - WHISPER_API_KEY=${WHISPER_API_KEY}
      - CHROMA_ANONYMIZED_TELEMETRY=False
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - chroma_data:/app/data/chroma_db
    depends_on:
      redis:
        condition: service_healthy
      postgres-master:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - umoya-network

  cdss-worker:
    build:
      context: ./services/cdss-service
      dockerfile: Dockerfile.prod
    image: umoya/cdss-service:${IMAGE_TAG:-latest}
    container_name: umoya-cdss-worker
    restart: unless-stopped
    command: ["python", "worker_main.py"]
    healthcheck:
      disable: true
    environment:
      - ENVIRONMENT=production
      - REDIS_URL=${SERVICE_REDIS_URL}
      - PYTHONUNBUFFERED=1
      - MASTER_DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${SERVICE_POSTGRES_HOST}:5432/${POSTGRES_DB}
      - CDSS_ENABLE_AI=${CDSS_ENABLE_AI:-true}
      - CDSS_REQUIRE_SERVICE_AUTH=true
      - CDSS_SERVICE_TOKEN=${CDSS_SERVICE_TOKEN}
      - CDSS_SERVICE_JWT_SECRET=${CDSS_SERVICE_JWT_SECRET}
      - CDSS_PHI_REDACTION_ENABLED=true
      - CDSS_BLOCK_OUTBOUND_PHI=true
      - CDSS_STRICT_EGRESS_ALLOWLIST=true
      - CDSS_ENCRYPTION_ENABLED=true
      - CDSS_ENCRYPTION_KEY=${CDSS_ENCRYPTION_KEY}
      - CDSS_ENCRYPTION_ALLOW_PLAINTEXT_READS=false
      - CDSS_JOB_WORKER_ENABLED=true
      - CDSS_JOB_QUEUE_NAME=${CDSS_JOB_QUEUE_NAME:-cdss:jobs:queue}
      - CDSS_JOB_DLQ_NAME=${CDSS_JOB_DLQ_NAME:-cdss:jobs:dead_letter}
      - MINIO_ENDPOINT=${SERVICE_MINIO_URL}
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - MINIO_BUCKET=umoya-documents
      - EHR_SERVICE_URL=${SERVICE_EHR_URL}
      - JWT_SECRET=${JWT_SECRET}
      - LLM_ENABLED=${LLM_ENABLED:-true}
      - ANONYMIZED_TELEMETRY=False
      - LLM_API_URL=${LLM_API_URL}
      - LLM_MODEL_NAME=${LLM_MODEL_NAME:-llama3.1:latest}
      - WHISPER_API_KEY=${WHISPER_API_KEY}
      - CHROMA_ANONYMIZED_TELEMETRY=False
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - chroma_data:/app/data/chroma_db
    depends_on:
      - cdss-service
    networks:
      - umoya-network

  medical-aid-demo-service:
    build:
      context: .
      dockerfile: services/medical-aid-demo-service/Dockerfile
    image: umoya/medical-aid-demo-service:${IMAGE_TAG:-latest}
    container_name: umoya-medical-aid-demo-service
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3004
      - DEMO_DATA_DIR=/app/services/medical-aid-demo-service/data
      - DEMO_PROVIDER_NAME=${MEDICAL_AID_DEMO_PROVIDER_NAME:-Umoya Demo Medical Aid}
      - DEMO_PROVIDER_CODE=${MEDICAL_AID_DEMO_PROVIDER_CODE:-demo_aid}
      - DEMO_API_KEY=${MEDICAL_AID_DEMO_API_KEY}
      - DEMO_REQUIRE_API_KEY=${MEDICAL_AID_DEMO_REQUIRE_API_KEY:-true}
    command: node services/medical-aid-demo-service/src/server.js
    networks:
      - umoya-network

  ehr-service:
    build:
      context: .
      dockerfile: services/ehr-service/Dockerfile
    image: umoya/ehr-service:${IMAGE_TAG:-latest}
    container_name: umoya-ehr-service
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3013
      - DB_HOST=${SERVICE_POSTGRES_HOST}
      - DB_PORT=5432
      - DB_USERNAME=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - SNOMED_USE_POSTGRES=true
      - SNOMED_USE_CACHE=true
      - CDSS_SERVICE_URL=${SERVICE_CDSS_URL}
      - CDSS_SERVICE_AUTH_MODE=${CDSS_SERVICE_AUTH_MODE:-both}
      - CDSS_SERVICE_TOKEN=${CDSS_SERVICE_TOKEN}
      - CDSS_SERVICE_JWT_SECRET=${CDSS_SERVICE_JWT_SECRET}
      - CDSS_SERVICE_AUTH_ISSUER=${CDSS_SERVICE_AUTH_ISSUER:-umoya.ehr-service}
      - CDSS_SERVICE_AUTH_AUDIENCE=${CDSS_SERVICE_AUTH_AUDIENCE:-umoya.cdss}
      - STORAGE_DRIVER=s3
      - STORAGE_S3_ENDPOINT=${STORAGE_S3_ENDPOINT}
      - STORAGE_S3_REGION=${STORAGE_S3_REGION}
      - STORAGE_S3_BUCKET=${STORAGE_S3_BUCKET}
      - STORAGE_S3_ACCESS_KEY=${STORAGE_S3_ACCESS_KEY}
      - STORAGE_S3_SECRET_KEY=${STORAGE_S3_SECRET_KEY}
      - STORAGE_S3_FORCE_PATH_STYLE=${STORAGE_S3_FORCE_PATH_STYLE}
      - STORAGE_S3_USE_SSL=${STORAGE_S3_USE_SSL}
      - STORAGE_S3_PUBLIC_BASE_URL=${MINIO_PUBLIC_URL}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001}
      - FEATURE_POSTVISIT_INGESTION_CRON=${FEATURE_POSTVISIT_INGESTION_CRON:-true}
      - WHISPER_API_KEY=${WHISPER_API_KEY}
      - WHISPER_API_URL=${WHISPER_API_URL}
      - FRONTEND_URL=${FRONTEND_URL}
      - PORTAL_BASE_URL=${PORTAL_BASE_URL}
      - PUBLIC_APP_BASE_URL=${PUBLIC_APP_BASE_URL}
      - RXNORM_BASE_URL=${RXNORM_BASE_URL}
      - POSTVISIT_LLM_API_URL=${POSTVISIT_LLM_API_URL}
      - CLINICAL_LLM_BACKEND=${CLINICAL_LLM_BACKEND:-ollama}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2:3b}
      - BEDROCK_MODEL_ID=${BEDROCK_MODEL_ID}
      - BEDROCK_ENDPOINT_URL=${BEDROCK_ENDPOINT_URL}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT}
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY}
      - AZURE_OPENAI_DEPLOYMENT=${AZURE_OPENAI_DEPLOYMENT}
      - AZURE_OPENAI_API_VERSION=${AZURE_OPENAI_API_VERSION}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL}
      - PAGERDUTY_EVENTS_API_URL=${PAGERDUTY_EVENTS_API_URL}
      - DHIS2_URL=${DHIS2_URL}
      - DHIS2_API_VERSION=${DHIS2_API_VERSION}
      - DHIS2_PAT=${DHIS2_PAT}
      - DHIS2_SCHEDULED_SYNC_ENABLED=${DHIS2_SCHEDULED_SYNC_ENABLED:-false}
      - DHIS2_SCHEDULED_RETRY_LIMIT=${DHIS2_SCHEDULED_RETRY_LIMIT:-20}
      - DHIS2_ALERT_LOOKBACK_HOURS=${DHIS2_ALERT_LOOKBACK_HOURS:-24}
      - DHIS2_ALERT_ERROR_THRESHOLD=${DHIS2_ALERT_ERROR_THRESHOLD:-10}
      - CRVS_ENABLED=${CRVS_ENABLED:-false}
      - CRVS_ENDPOINT=${CRVS_ENDPOINT:-}
      - CRVS_API_KEY=${CRVS_API_KEY:-}
      - SMS_ENABLED=${SMS_ENABLED:-false}
      - AT_API_KEY=${AT_API_KEY:-}
      - AT_USERNAME=${AT_USERNAME:-sandbox}
      - AT_SENDER_ID=${AT_SENDER_ID:-Umoya}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-referrals@umoya.health}
      - MEDICAL_AID_DEMO_ENABLED=${MEDICAL_AID_DEMO_ENABLED:-true}
      - MEDICAL_AID_DEMO_FORCE=false
      - MEDICAL_AID_DEMO_BASE_URL=${MEDICAL_AID_DEMO_BASE_URL:-http://medical-aid-demo-service:3004}
      - MEDICAL_AID_DEMO_API_KEY=${MEDICAL_AID_DEMO_API_KEY}
    command: npm start
    volumes:
      - ${HOME}/.aws:/root/.aws:ro
    depends_on:
      postgres-master:
        condition: service_healthy
      cdss-service:
        condition: service_healthy
      minio:
        condition: service_healthy
      medical-aid-demo-service:
        condition: service_started
    networks:
      - umoya-network

  web-app:
    build:
      context: ./web-app
      dockerfile: Dockerfile
    image: umoya/web-app:${IMAGE_TAG:-latest}
    container_name: umoya-web-app
    restart: unless-stopped
    ports:
      - "${PORT_WEB_APP:-3011}:80"
    environment:
      - REACT_APP_TENANT_API_URL_INTERNAL=http://umoya-tenant-service:3001
      - SERVICE_TENANT_URL=${SERVICE_TENANT_URL}
      - SERVICE_EHR_URL=${SERVICE_EHR_URL}
      - SERVICE_CDSS_URL=${SERVICE_CDSS_URL}
    depends_on:
      tenant-service:
        condition: service_healthy
    networks:
      - umoya-network

  ehr-frontend:
    build:
      context: ./ehr-frontend
      dockerfile: Dockerfile
    image: umoya/ehr-frontend:${IMAGE_TAG:-latest}
    container_name: umoya-ehr-frontend
    restart: unless-stopped
    ports:
      - "${PORT_EHR_FRONTEND:-3000}:80"
    environment:
      - SERVICE_TENANT_URL=${SERVICE_TENANT_URL:-http://tenant-service:3001}
      - SERVICE_EHR_URL=${SERVICE_EHR_URL:-http://ehr-service:3013}
      - SERVICE_CDSS_URL=${SERVICE_CDSS_URL:-http://cdss-service:8000}
    depends_on:
      - tenant-service
      - ehr-service
    networks:
      - umoya-network

  patient-portal:
    build:
      context: ./patient-portal
      dockerfile: Dockerfile
    image: umoya/patient-portal:${IMAGE_TAG:-latest}
    container_name: umoya-patient-portal
    restart: unless-stopped
    ports:
      - "${PORT_PATIENT_PORTAL:-3015}:80"
    environment:
      - SERVICE_EHR_URL=${SERVICE_EHR_URL:-http://ehr-service:3013}
    depends_on:
      - ehr-service
    networks:
      - umoya-network

  prometheus:
    image: prom/prometheus:latest
    container_name: umoya-prometheus
    restart: unless-stopped
    volumes:
      - ./infrastructure/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - umoya-network

  grafana:
    image: grafana/grafana:latest
    container_name: umoya-grafana
    restart: unless-stopped
    ports:
      - "${PORT_GRAFANA:-3012}:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-http://localhost:3012}
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - umoya-network

volumes:
  postgres_master_data:
  redis_data:
  minio_data:
  chroma_data:
  grafana_data:
  prometheus_data:

networks:
  umoya-network:
    driver: bridge
