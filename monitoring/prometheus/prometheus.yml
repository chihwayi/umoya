global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    cluster: 'medicore'
    environment: 'production'

rule_files:
  - '/etc/prometheus/alerts/*.yml'

scrape_configs:
  - job_name: 'ehr-service'
    static_configs:
      - targets: ['ehr-service:3001']
        labels:
          service: 'ehr'
          module: 'api'
    metrics_path: '/api/metrics'
    scrape_interval: 30s

  - job_name: 'tenant-service'
    static_configs:
      - targets: ['tenant-service:3000']
        labels:
          service: 'tenant'
          module: 'provisioning'
    metrics_path: '/metrics'
    scrape_interval: 30s

  - job_name: 'cdss-service'
    static_configs:
      - targets: ['cdss-service:8000']
        labels:
          service: 'cdss'
          module: 'ai'
    metrics_path: '/metrics'
    scrape_interval: 30s

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
