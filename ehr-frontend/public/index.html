<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Favicons — icon-only mark, scales well at 16x16 through 512x512 -->
  <link rel="icon" type="image/png" sizes="32x32"  href="%PUBLIC_URL%/favicon.png" />
  <link rel="icon" type="image/png" sizes="16x16"  href="%PUBLIC_URL%/favicon.png" />
  <link rel="shortcut icon"                        href="%PUBLIC_URL%/favicon.png" />
  <link rel="apple-touch-icon" sizes="180x180"     href="%PUBLIC_URL%/umoya-icon.png" />

  <meta name="theme-color" content="#0AA98A" />
  <meta name="application-name" content="Umoya EHR" />
  <meta name="description" content="Umoya — Clinical intelligence. Continuity of care. AI-first EHR for Africa and the world." />

  <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
  <title>Umoya EHR</title>
  <script>
    window.WebSocket = function() { return { close: function() {}, send: function() {} }; };
    window.EventSource = function() { return { close: function() {} }; };
    const originalError = console.error;
    console.error = function(...args) {
      const message = args.join(' ');
      if (message.includes('WebSocket') || message.includes('ws://') || message.includes('interrupted while')) return;
      originalError.apply(console, args);
    };
  </script>
</head>
<body>
  <div id="root"></div>
</body>
</html>
