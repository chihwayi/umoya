<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="%PUBLIC_URL%/umoya.png" />
  <link rel="apple-touch-icon" href="%PUBLIC_URL%/umoya.png" />
  <meta name="theme-color" content="#080E1A" />
  <title>Umoya EHR - Healthcare Management System</title>
  <script>
    // Disable WebSocket to stop connection attempts
    window.WebSocket = function() { return { close: function() {}, send: function() {} }; };
    window.EventSource = function() { return { close: function() {} }; };
    
    // Suppress console errors
    const originalError = console.error;
    console.error = function(...args) {
      const message = args.join(' ');
      if (message.includes('WebSocket') || message.includes('ws://') || message.includes('interrupted while')) {
        return;
      }
      originalError.apply(console, args);
    };
  </script>
</head>
<body>
  <div id="root"></div>
</body>
</html>
