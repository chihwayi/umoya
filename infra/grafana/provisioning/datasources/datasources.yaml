apiVersion: 1
datasources:
  - name: PostgreSQL-Umoya
    type: postgres
    url: postgres-master:5432
    database: umoya_production
    user: ${GRAFANA_DB_USER:-umoya}
    secureJsonData:
      password: ${GRAFANA_DB_PASSWORD:-umoya_password}
    jsonData:
      sslmode: disable
      maxOpenConns: 5
      connMaxLifetime: 14400
      postgresVersion: 1500
      timescaledb: false
    editable: false

  - name: Prometheus
    type: prometheus
    url: http://umoya-prometheus:9090
    access: proxy
    editable: false
