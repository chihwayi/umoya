version: '3.8'

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: umoya-elasticsearch
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms4g -Xmx4g"
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      - cluster.routing.allocation.disk.threshold_enabled=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - ./snowstorm/es-data:/usr/share/elasticsearch/data
    ports:
      - "${PORT_ELASTICSEARCH:-9200}:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
    networks:
      - umoya

  snowstorm:
    image: snomedinternational/snowstorm:latest
    container_name: umoya-snowstorm
    environment:
      - "JAVA_OPTS=-Xms2g -Xmx4g -XX:+UseG1GC"
      - elasticsearch.urls=http://elasticsearch:9200
      - elasticsearch.index.prefix=snowstorm
    depends_on:
      elasticsearch:
        condition: service_healthy
    volumes:
      - ./snowstorm/import:/opt/snowstorm/import:ro
    ports:
      - "${PORT_SNOWSTORM:-8080}:8080"
    networks:
      - umoya

networks:
  umoya:
    external: true
