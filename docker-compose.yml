version: '3.8'

services:
  # Databases
  postgres-master:
    image: postgres:15-alpine
    container_name: medicore-postgres-master
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${PORT_POSTGRES}:5432"
    volumes:
      - postgres_master_data:/var/lib/postgresql/data
      - ./database/schemas/tenant.sql:/docker-entrypoint-initdb.d/01-tenant.sql
    networks:
      - medicore-network

  redis:
    image: redis:7-alpine
    container_name: medicore-redis
    ports:
      - "${PORT_REDIS}:6379"
    volumes:
      - redis_data:/data
    networks:
      - medicore-network

  minio:
    image: minio/minio:RELEASE.2023-10-07T15-07-38Z
    container_name: medicore-minio
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    command: server --console-address ":9001" /data
    ports:
      - "${PORT_MINIO}:9000"
      - "${PORT_MINIO_CONSOLE}:9001"
    volumes:
      - minio_data:/data
    networks:
      - medicore-network

  # Core Services
  tenant-service:
    build:
      context: .
      dockerfile: services/tenant-service/Dockerfile
    container_name: medicore-tenant-service
    ports:
      - "${PORT_TENANT_SERVICE}:3001"
    environment:
      - NODE_ENV=${ENVIRONMENT}
      - PORT=3001
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${SERVICE_POSTGRES_HOST}:5432/${POSTGRES_DB}
      - REDIS_URL=${SERVICE_REDIS_URL}
      - DB_HOST=${SERVICE_POSTGRES_HOST}
      - DB_PORT=5432
      - DB_USERNAME=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - MINIO_URL=${SERVICE_MINIO_URL}
      - BACKUP_BUCKET_NAME=${BACKUP_BUCKET_NAME}
      - MINIO_PUBLIC_URL=${MINIO_PUBLIC_URL}
      - AWS_REGION=${AWS_REGION}
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD}
      - AWS_ENDPOINT=${SERVICE_MINIO_URL}
    volumes:
      - ./services/tenant-service:/app/services/tenant-service
      - /app/services/tenant-service/node_modules
    command: npm run dev
    depends_on:
      - postgres-master
      - redis
    networks:
      - medicore-network

  cdss-service:
    build:
      context: ./services/cdss-service
      dockerfile: Dockerfile
    container_name: medicore-cdss-service
    ports:
      - "${PORT_CDSS_SERVICE}:8000"
    environment:
      - ENVIRONMENT=${ENVIRONMENT}
      - REDIS_URL=${SERVICE_REDIS_URL}
      - PYTHONUNBUFFERED=1
      - CDSS_ENABLE_AI=${CDSS_ENABLE_AI}
      - MOCK_VISION_AI=${MOCK_VISION_AI}
      - MINIO_ENDPOINT=${SERVICE_MINIO_URL}
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - MINIO_BUCKET=medicore-documents
      - EHR_SERVICE_URL=${SERVICE_EHR_URL}
      - CDSS_USE_EHR_TERMINOLOGY=true
      - CORS_ORIGINS=${CORS_ORIGINS}
      - LLM_API_URL=${LLM_API_URL}
      - WHISPER_API_KEY=${WHISPER_API_KEY}
    depends_on:
      - redis
      - postgres-master
    networks:
      - medicore-network
    volumes:
      - ./services/cdss-service:/app

  ehr-service:
    build:
      context: .
      dockerfile: services/ehr-service/Dockerfile
    container_name: medicore-ehr-service
    ports:
      - "${PORT_EHR_SERVICE}:3013"
    environment:
      - NODE_ENV=${ENVIRONMENT}
      - PORT=3013
      - DB_HOST=${SERVICE_POSTGRES_HOST}
      - DB_PORT=5432
      - DB_USERNAME=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - JWT_SECRET=${JWT_SECRET}
      - SNOMED_USE_POSTGRES=true
      - SNOMED_USE_CACHE=false
      - CDSS_SERVICE_URL=${SERVICE_CDSS_URL}
      - STORAGE_DRIVER=s3
      - STORAGE_S3_ENDPOINT=${STORAGE_S3_ENDPOINT}
      - STORAGE_S3_REGION=${STORAGE_S3_REGION}
      - STORAGE_S3_BUCKET=${STORAGE_S3_BUCKET}
      - STORAGE_S3_ACCESS_KEY=${STORAGE_S3_ACCESS_KEY}
      - STORAGE_S3_SECRET_KEY=${STORAGE_S3_SECRET_KEY}
      - STORAGE_S3_FORCE_PATH_STYLE=${STORAGE_S3_FORCE_PATH_STYLE}
      - STORAGE_S3_USE_SSL=${STORAGE_S3_USE_SSL}
      - STORAGE_S3_PUBLIC_BASE_URL=${MINIO_PUBLIC_URL}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - WHISPER_API_KEY=${WHISPER_API_KEY}
    command: npm run dev
    volumes:
      - ./services/ehr-service/src:/app/services/ehr-service/src
      - ./services/ehr-service/package.json:/app/services/ehr-service/package.json
      - ./services/ehr-service/who-smart-guidelines:/app/services/ehr-service/who-smart-guidelines
      - ./database/schemas:/app/database/schemas
    depends_on:
      - postgres-master
      - cdss-service
      - minio
    networks:
      - medicore-network

  # Frontends
  web-app:
    build:
      context: ./web-app
      dockerfile: Dockerfile.dev
    container_name: medicore-web-app
    ports:
      - "${PORT_WEB_APP}:3011"
    environment:
      - PORT=3011
      - REACT_APP_API_URL=/api
      - EHR_SERVICE_URL=${SERVICE_EHR_URL}
      - REACT_APP_ENVIRONMENT=${ENVIRONMENT}
      - CHOKIDAR_USEPOLLING=true
      - FAST_REFRESH=false
      - GENERATE_SOURCEMAP=false
      - DISABLE_ESLINT_PLUGIN=true
      - TSC_COMPILE_ON_ERROR=true
      - WATCHPACK_POLLING=true
    volumes:
      - ./web-app/src:/app/src
      - ./web-app/public:/app/public
    depends_on:
      - tenant-service
    networks:
      - medicore-network

  ehr-frontend:
    build:
      context: ./ehr-frontend
      dockerfile: Dockerfile.dev
    container_name: medicore-ehr-frontend
    ports:
      - "${PORT_EHR_FRONTEND}:3000"
    environment:
      - PORT=3000
      - REACT_APP_API_URL=${REACT_APP_API_URL}
      - REACT_APP_EHR_API_URL=${REACT_APP_EHR_API_URL}
      - REACT_APP_CDSS_API_URL=${REACT_APP_CDSS_API_URL}
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=1000
      - FAST_REFRESH=true
      - GENERATE_SOURCEMAP=false
      - DISABLE_ESLINT_PLUGIN=true
      - TSC_COMPILE_ON_ERROR=true
      - WATCHPACK_POLLING=true
      - WDS_SOCKET_HOST=0.0.0.0
      - WDS_SOCKET_PORT=3000
      - WDS_SOCKET_URL=${REACT_APP_WS_URL}
      - REACT_APP_CHOKIDAR_USEPOLLING=true
      - BROWSER=none
    volumes:
      - ./ehr-frontend/src:/app/src
      - ./ehr-frontend/public:/app/public
      - ./ehr-frontend/package.json:/app/package.json
      - ./ehr-frontend/package-lock.json:/app/package-lock.json
      - ./ehr-frontend/tsconfig.json:/app/tsconfig.json
      - ./ehr-frontend/tailwind.config.js:/app/tailwind.config.js
      - ./ehr-frontend/postcss.config.js:/app/postcss.config.js
    depends_on:
      - tenant-service
      - ehr-service
    networks:
      - medicore-network

  patient-portal:
    build:
      context: ./patient-portal
      dockerfile: Dockerfile.dev
    container_name: medicore-patient-portal
    ports:
      - "${PORT_PATIENT_PORTAL}:3015"
    environment:
      - PORT=3015
      - REACT_APP_EHR_API_URL=${REACT_APP_EHR_API_URL}
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=1000
      - FAST_REFRESH=true
      - GENERATE_SOURCEMAP=false
      - DISABLE_ESLINT_PLUGIN=true
      - TSC_COMPILE_ON_ERROR=true
      - WATCHPACK_POLLING=true
      - WDS_SOCKET_HOST=0.0.0.0
      - WDS_SOCKET_PORT=3015
      - REACT_APP_CHOKIDAR_USEPOLLING=true
      - BROWSER=none
    volumes:
      - ./patient-portal/src:/app/src
      - ./patient-portal/public:/app/public
      - ./patient-portal/package.json:/app/package.json
      - ./patient-portal/package-lock.json:/app/package-lock.json
      - ./patient-portal/tsconfig.json:/app/tsconfig.json
      - ./patient-portal/tailwind.config.js:/app/tailwind.config.js
      - ./patient-portal/postcss.config.js:/app/postcss.config.js
    depends_on:
      - ehr-service
    networks:
      - medicore-network

  # Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: medicore-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - medicore-network

  grafana:
    image: grafana/grafana:latest
    container_name: medicore-grafana
    ports:
      - "3012:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - medicore-network

volumes:
  postgres_master_data:
  redis_data:
  minio_data:
  grafana_data:

networks:
  medicore-network:
    driver: bridge
