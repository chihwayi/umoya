services:
  # Databases
  postgres-master:
    image: pgvector/pgvector:pg15
    container_name: medicore-postgres-master
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${PORT_POSTGRES}:5432"
    volumes:
      - postgres_master_data:/var/lib/postgresql/data
      - ./database/schemas/tenant.sql:/docker-entrypoint-initdb.d/01-tenant.sql
    networks:
      - medicore-network

  redis:
    image: redis:7-alpine
    container_name: medicore-redis
    ports:
      - "${PORT_REDIS}:6379"
    volumes:
      - redis_data:/data
    networks:
      - medicore-network

  minio:
    image: minio/minio:RELEASE.2023-10-07T15-07-38Z
    container_name: medicore-minio
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    command: server --console-address ":9001" /data
    ports:
      - "${PORT_MINIO}:9000"
      - "${PORT_MINIO_CONSOLE}:9001"
    volumes:
      - minio_data:/data
    networks:
      - medicore-network

  # Core Services
  tenant-service:
    build:
      context: .
      dockerfile: services/tenant-service/Dockerfile
    container_name: medicore-tenant-service
    ports:
      - "${PORT_TENANT_SERVICE}:3001"
    environment:
      - NODE_ENV=${ENVIRONMENT}
      - PORT=3001
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${SERVICE_POSTGRES_HOST}:5432/${POSTGRES_DB}
      - REDIS_URL=${SERVICE_REDIS_URL}
      - DB_HOST=${SERVICE_POSTGRES_HOST}
      - DB_PORT=5432
      - DB_USERNAME=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - MINIO_URL=${SERVICE_MINIO_URL}
      - BACKUP_BUCKET_NAME=${BACKUP_BUCKET_NAME}
      - MINIO_PUBLIC_URL=${MINIO_PUBLIC_URL}
      - AWS_REGION=${AWS_REGION}
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD}
      - AWS_ENDPOINT=${SERVICE_MINIO_URL}
      - JWT_SECRET=${JWT_SECRET}
      - SERVICE_TENANT_URL=${SERVICE_TENANT_URL}
      - SERVICE_EHR_URL=${SERVICE_EHR_URL}
      - SERVICE_CDSS_URL=${SERVICE_CDSS_URL}
      - SUPER_ADMIN_WEB_URL=http://web-app:3011
      - EHR_FRONTEND_URL=http://ehr-frontend:3000
      - MEDICAL_AID_DEMO_BASE_URL=${MEDICAL_AID_DEMO_BASE_URL:-http://medical-aid-demo-service:3004}
      - CDSS_SERVICE_TOKEN=${CDSS_SERVICE_TOKEN:-dev_cdss_service_token_change_in_production}
      - LLM_API_URL=${LLM_API_URL:-http://host.docker.internal:11434}
      - SUPER_ADMIN_TEST_TENANT_ID=${SUPER_ADMIN_TEST_TENANT_ID:-kids-clinic}
      - DOCKER_SOCKET_PATH=/var/run/docker.sock
    volumes:
      - ./services/tenant-service:/app/services/tenant-service
      - /app/services/tenant-service/node_modules
      - /var/run/docker.sock:/var/run/docker.sock
    command: sh -lc "npm run build && npm start"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"const http=require('http');const req=http.get('http://localhost:3001/api/auth/profile',res=>process.exit(res.statusCode>=500?1:0));req.on('error',()=>process.exit(1));req.setTimeout(3000,()=>{req.destroy();process.exit(1);});\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    depends_on:
      - postgres-master
      - redis
    networks:
      - medicore-network

  cdss-service:
    build:
      context: ./services/cdss-service
      dockerfile: Dockerfile
    container_name: medicore-cdss-service
    ports:
      - "${PORT_CDSS_SERVICE}:8000"
    environment:
      - ENVIRONMENT=${ENVIRONMENT}
      - REDIS_URL=${SERVICE_REDIS_URL}
      - PYTHONUNBUFFERED=1
      - MASTER_DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${SERVICE_POSTGRES_HOST}:5432/${POSTGRES_DB}
      - CDSS_ENABLE_AI=${CDSS_ENABLE_AI:-true}
      - CDSS_REQUIRE_SERVICE_AUTH=${CDSS_REQUIRE_SERVICE_AUTH:-true}
      - CDSS_SERVICE_AUTH_MODE=${CDSS_SERVICE_AUTH_MODE:-both}
      - CDSS_SERVICE_TOKEN=${CDSS_SERVICE_TOKEN:-dev_cdss_service_token_change_in_production}
      - CDSS_SERVICE_JWT_SECRET=${CDSS_SERVICE_JWT_SECRET:-dev_cdss_service_jwt_secret_change_in_production}
      - CDSS_SERVICE_AUTH_ISSUER=${CDSS_SERVICE_AUTH_ISSUER:-medicore.ehr-service}
      - CDSS_SERVICE_AUTH_AUDIENCE=${CDSS_SERVICE_AUTH_AUDIENCE:-medicore.cdss}
      - CDSS_SERVICE_AUTH_JWT_REPLAY_STRICT=${CDSS_SERVICE_AUTH_JWT_REPLAY_STRICT:-false}
      - CDSS_PHI_REDACTION_ENABLED=${CDSS_PHI_REDACTION_ENABLED:-true}
      - CDSS_BLOCK_OUTBOUND_PHI=${CDSS_BLOCK_OUTBOUND_PHI:-true}
      - CDSS_STRICT_EGRESS_ALLOWLIST=${CDSS_STRICT_EGRESS_ALLOWLIST:-true}
      - CDSS_ENCRYPTION_ENABLED=${CDSS_ENCRYPTION_ENABLED:-true}
      - CDSS_ENCRYPTION_PROVIDER=${CDSS_ENCRYPTION_PROVIDER:-local}
      - CDSS_ENCRYPTION_KEY_ID=${CDSS_ENCRYPTION_KEY_ID:-local-dev-v1}
      - CDSS_ENCRYPTION_KEY=${CDSS_ENCRYPTION_KEY:-h7X7Tr_3k0-Tl3xw8tS9AqK3f7fjoGv0VGfT3d2i-9o=}
      - CDSS_ENCRYPTION_ALLOW_PLAINTEXT_READS=${CDSS_ENCRYPTION_ALLOW_PLAINTEXT_READS:-true}
      - CDSS_JOB_WORKER_ENABLED=${CDSS_JOB_WORKER_ENABLED:-true}
      - CDSS_JOB_QUEUE_NAME=${CDSS_JOB_QUEUE_NAME:-cdss:jobs:queue}
      - CDSS_JOB_DLQ_NAME=${CDSS_JOB_DLQ_NAME:-cdss:jobs:dead_letter}
      - CDSS_JOB_WORKER_POLL_SECONDS=${CDSS_JOB_WORKER_POLL_SECONDS:-5}
      - CDSS_EGRESS_ALLOWLIST=${CDSS_EGRESS_ALLOWLIST:-}
      - MOCK_VISION_AI=${MOCK_VISION_AI}
      - MINIO_ENDPOINT=${SERVICE_MINIO_URL}
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - MINIO_BUCKET=medicore-documents
      - EHR_SERVICE_URL=${SERVICE_EHR_URL}
      - CDSS_USE_EHR_TERMINOLOGY=true
      - JWT_SECRET=${JWT_SECRET}
      - OWNER_EMAILS=${OWNER_EMAILS:-owner@medicore.local}
      - CDSS_OWNER_SCOPE_STRICT=${CDSS_OWNER_SCOPE_STRICT:-false}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - LLM_ENABLED=true
      - ANONYMIZED_TELEMETRY=False
      - LLM_API_URL=${LLM_API_URL}
      - LLM_MODEL_NAME=${LLM_MODEL_NAME:-llama3.1:latest}
      - LLM_TIMEOUT_SECONDS=${LLM_TIMEOUT_SECONDS:-60}
      - LLM_GUIDELINES_TIMEOUT_SECONDS=${LLM_GUIDELINES_TIMEOUT_SECONDS:-20}
      - LLM_MAX_RETRIES=0
      - WHISPER_API_KEY=${WHISPER_API_KEY}
      - CHROMA_ANONYMIZED_TELEMETRY=False
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./services/cdss-service:/app
      - ./data/chroma_db:/app/data/chroma_db
    depends_on:
      - redis
      - postgres-master
      - minio
    networks:
      - medicore-network

  cdss-worker:
    build:
      context: ./services/cdss-service
      dockerfile: Dockerfile
    container_name: medicore-cdss-worker
    command: ["sh", "-c", "pip install --quiet asyncpg>=0.29.0 && python worker_main.py"]
    healthcheck:
      disable: true
    environment:
      - ENVIRONMENT=${ENVIRONMENT}
      - REDIS_URL=${SERVICE_REDIS_URL}
      - PYTHONUNBUFFERED=1
      - MASTER_DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${SERVICE_POSTGRES_HOST}:5432/${POSTGRES_DB}
      - CDSS_ENABLE_AI=${CDSS_ENABLE_AI:-true}
      - CDSS_REQUIRE_SERVICE_AUTH=${CDSS_REQUIRE_SERVICE_AUTH:-true}
      - CDSS_SERVICE_AUTH_MODE=${CDSS_SERVICE_AUTH_MODE:-both}
      - CDSS_SERVICE_TOKEN=${CDSS_SERVICE_TOKEN:-dev_cdss_service_token_change_in_production}
      - CDSS_SERVICE_JWT_SECRET=${CDSS_SERVICE_JWT_SECRET:-dev_cdss_service_jwt_secret_change_in_production}
      - CDSS_SERVICE_AUTH_ISSUER=${CDSS_SERVICE_AUTH_ISSUER:-medicore.ehr-service}
      - CDSS_SERVICE_AUTH_AUDIENCE=${CDSS_SERVICE_AUTH_AUDIENCE:-medicore.cdss}
      - CDSS_SERVICE_AUTH_JWT_REPLAY_STRICT=${CDSS_SERVICE_AUTH_JWT_REPLAY_STRICT:-false}
      - CDSS_PHI_REDACTION_ENABLED=${CDSS_PHI_REDACTION_ENABLED:-true}
      - CDSS_BLOCK_OUTBOUND_PHI=${CDSS_BLOCK_OUTBOUND_PHI:-true}
      - CDSS_STRICT_EGRESS_ALLOWLIST=${CDSS_STRICT_EGRESS_ALLOWLIST:-true}
      - CDSS_ENCRYPTION_ENABLED=${CDSS_ENCRYPTION_ENABLED:-true}
      - CDSS_ENCRYPTION_PROVIDER=${CDSS_ENCRYPTION_PROVIDER:-local}
      - CDSS_ENCRYPTION_KEY_ID=${CDSS_ENCRYPTION_KEY_ID:-local-dev-v1}
      - CDSS_ENCRYPTION_KEY=${CDSS_ENCRYPTION_KEY:-h7X7Tr_3k0-Tl3xw8tS9AqK3f7fjoGv0VGfT3d2i-9o=}
      - CDSS_ENCRYPTION_ALLOW_PLAINTEXT_READS=${CDSS_ENCRYPTION_ALLOW_PLAINTEXT_READS:-true}
      - CDSS_JOB_WORKER_ENABLED=${CDSS_JOB_WORKER_ENABLED:-true}
      - CDSS_JOB_QUEUE_NAME=${CDSS_JOB_QUEUE_NAME:-cdss:jobs:queue}
      - CDSS_JOB_DLQ_NAME=${CDSS_JOB_DLQ_NAME:-cdss:jobs:dead_letter}
      - CDSS_JOB_WORKER_POLL_SECONDS=${CDSS_JOB_WORKER_POLL_SECONDS:-5}
      - CDSS_EGRESS_ALLOWLIST=${CDSS_EGRESS_ALLOWLIST:-}
      - MOCK_VISION_AI=${MOCK_VISION_AI}
      - MINIO_ENDPOINT=${SERVICE_MINIO_URL}
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - MINIO_BUCKET=medicore-documents
      - EHR_SERVICE_URL=${SERVICE_EHR_URL}
      - CDSS_USE_EHR_TERMINOLOGY=true
      - JWT_SECRET=${JWT_SECRET}
      - OWNER_EMAILS=${OWNER_EMAILS:-owner@medicore.local}
      - CDSS_OWNER_SCOPE_STRICT=${CDSS_OWNER_SCOPE_STRICT:-false}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - LLM_ENABLED=true
      - ANONYMIZED_TELEMETRY=False
      - LLM_API_URL=${LLM_API_URL}
      - LLM_MODEL_NAME=${LLM_MODEL_NAME:-llama3.1:latest}
      - LLM_TIMEOUT_SECONDS=${LLM_TIMEOUT_SECONDS:-60}
      - LLM_MAX_RETRIES=0
      - WHISPER_API_KEY=${WHISPER_API_KEY}
      - CHROMA_ANONYMIZED_TELEMETRY=False
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./services/cdss-service:/app
      - ./data/chroma_db:/app/data/chroma_db
    depends_on:
      - redis
      - postgres-master
      - minio
    networks:
      - medicore-network

  medical-aid-demo-service:
    build:
      context: .
      dockerfile: services/medical-aid-demo-service/Dockerfile
    container_name: medicore-medical-aid-demo-service
    ports:
      - "${PORT_MEDICAL_AID_DEMO_SERVICE:-3004}:3004"
    environment:
      - NODE_ENV=${ENVIRONMENT}
      - PORT=3004
      - DEMO_DATA_DIR=/app/services/medical-aid-demo-service/data
      - DEMO_PROVIDER_NAME=${MEDICAL_AID_DEMO_PROVIDER_NAME:-MediCore Demo Medical Aid}
      - DEMO_PROVIDER_CODE=${MEDICAL_AID_DEMO_PROVIDER_CODE:-demo_aid}
      - DEMO_API_KEY=${MEDICAL_AID_DEMO_API_KEY:-demo-medical-aid-key}
      - DEMO_REQUIRE_API_KEY=${MEDICAL_AID_DEMO_REQUIRE_API_KEY:-false}
    volumes:
      - ./services/medical-aid-demo-service:/app/services/medical-aid-demo-service
      - /app/services/medical-aid-demo-service/node_modules
    command: node --watch services/medical-aid-demo-service/src/server.js
    networks:
      - medicore-network

  ehr-service:
    build:
      context: .
      dockerfile: services/ehr-service/Dockerfile
    container_name: medicore-ehr-service
    ports:
      - "${PORT_EHR_SERVICE}:3013"
    environment:
      - NODE_ENV=${ENVIRONMENT}
      - PORT=3013
      - DB_HOST=${SERVICE_POSTGRES_HOST}
      - DB_PORT=5432
      - DB_USERNAME=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - JWT_SECRET=${JWT_SECRET}
      - SNOMED_USE_POSTGRES=true
      - SNOMED_USE_CACHE=false
      - CDSS_SERVICE_URL=${SERVICE_CDSS_URL}
      - CDSS_SERVICE_AUTH_MODE=${CDSS_SERVICE_AUTH_MODE:-both}
      - CDSS_SERVICE_TOKEN=${CDSS_SERVICE_TOKEN:-dev_cdss_service_token_change_in_production}
      - CDSS_SERVICE_JWT_SECRET=${CDSS_SERVICE_JWT_SECRET:-dev_cdss_service_jwt_secret_change_in_production}
      - CDSS_SERVICE_AUTH_ISSUER=${CDSS_SERVICE_AUTH_ISSUER:-medicore.ehr-service}
      - CDSS_SERVICE_AUTH_AUDIENCE=${CDSS_SERVICE_AUTH_AUDIENCE:-medicore.cdss}
      - CDSS_GUIDELINES_SEARCH_TIMEOUT_MS=${CDSS_GUIDELINES_SEARCH_TIMEOUT_MS:-50000}
      - STORAGE_DRIVER=s3
      - STORAGE_S3_ENDPOINT=${STORAGE_S3_ENDPOINT}
      - STORAGE_S3_REGION=${STORAGE_S3_REGION}
      - STORAGE_S3_BUCKET=${STORAGE_S3_BUCKET}
      - STORAGE_S3_ACCESS_KEY=${STORAGE_S3_ACCESS_KEY}
      - STORAGE_S3_SECRET_KEY=${STORAGE_S3_SECRET_KEY}
      - STORAGE_S3_FORCE_PATH_STYLE=${STORAGE_S3_FORCE_PATH_STYLE}
      - STORAGE_S3_USE_SSL=${STORAGE_S3_USE_SSL}
      - STORAGE_S3_PUBLIC_BASE_URL=${MINIO_PUBLIC_URL}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - WHISPER_API_KEY=${WHISPER_API_KEY}
      - WHISPER_API_URL=${WHISPER_API_URL}
      - FRONTEND_URL=${FRONTEND_URL}
      - PORTAL_BASE_URL=${PORTAL_BASE_URL}
      - PUBLIC_APP_BASE_URL=${PUBLIC_APP_BASE_URL}
      - PUBLIC_STAFF_APP_PATH=${PUBLIC_STAFF_APP_PATH}
      - PUBLIC_PATIENT_PORTAL_PATH=${PUBLIC_PATIENT_PORTAL_PATH}
      - PUBLIC_ADMIN_APP_PATH=${PUBLIC_ADMIN_APP_PATH}
      - RXNORM_BASE_URL=${RXNORM_BASE_URL}
      - POSTVISIT_LLM_API_URL=${POSTVISIT_LLM_API_URL}
      - PAGERDUTY_EVENTS_API_URL=${PAGERDUTY_EVENTS_API_URL}
      - DHIS2_URL=${DHIS2_URL}
      - DHIS2_API_VERSION=${DHIS2_API_VERSION}
      - DHIS2_PAT=${DHIS2_PAT}
      - DHIS2_SCHEDULED_SYNC_ENABLED=${DHIS2_SCHEDULED_SYNC_ENABLED:-false}
      - DHIS2_SCHEDULED_RETRY_LIMIT=${DHIS2_SCHEDULED_RETRY_LIMIT:-20}
      - DHIS2_ALERT_LOOKBACK_HOURS=${DHIS2_ALERT_LOOKBACK_HOURS:-24}
      - DHIS2_ALERT_ERROR_THRESHOLD=${DHIS2_ALERT_ERROR_THRESHOLD:-10}
      - DHIS2_ALERT_WEBHOOK_URL=${DHIS2_ALERT_WEBHOOK_URL:-}
      - DHIS2_PAGERDUTY_ROUTING_KEY=${DHIS2_PAGERDUTY_ROUTING_KEY:-}
      - MEDICAL_AID_DEMO_ENABLED=${MEDICAL_AID_DEMO_ENABLED:-true}
      - MEDICAL_AID_DEMO_FORCE=${MEDICAL_AID_DEMO_FORCE:-false}
      - MEDICAL_AID_DEMO_BASE_URL=${MEDICAL_AID_DEMO_BASE_URL:-http://medical-aid-demo-service:3004}
      - MEDICAL_AID_DEMO_API_KEY=${MEDICAL_AID_DEMO_API_KEY:-demo-medical-aid-key}
      - MEDICAL_AID_DEMO_PROVIDER_NAMES=${MEDICAL_AID_DEMO_PROVIDER_NAMES:-cimas,premier,econet_health,psmas,first_mutual,demo_aid}
    command: npm run dev
    volumes:
      - ./services/ehr-service/src:/app/services/ehr-service/src
      - ./services/ehr-service/package.json:/app/services/ehr-service/package.json
      - ./services/ehr-service/who-smart-guidelines:/app/services/ehr-service/who-smart-guidelines
      - ./database/schemas:/app/database/schemas
    depends_on:
      - postgres-master
      - cdss-service
      - minio
      - medical-aid-demo-service
    networks:
      - medicore-network

  # Frontends
  web-app:
    build:
      context: ./web-app
      dockerfile: Dockerfile.dev
    container_name: medicore-web-app
    ports:
      - "${PORT_WEB_APP}:3011"
    environment:
      - PORT=3011
      - REACT_APP_API_URL=/api
      - SERVICE_BASE_URL=${SERVICE_BASE_URL}
      - SERVICE_TENANT_PATH=${SERVICE_TENANT_PATH}
      - SERVICE_EHR_PATH=${SERVICE_EHR_PATH}
      - SERVICE_CDSS_PATH=${SERVICE_CDSS_PATH}
      - SERVICE_TENANT_URL=${SERVICE_TENANT_URL}
      - SERVICE_EHR_URL=${SERVICE_EHR_URL}
      - SERVICE_CDSS_URL=${SERVICE_CDSS_URL}
      - EHR_SERVICE_URL=${SERVICE_EHR_URL}
      - REACT_APP_ENVIRONMENT=${ENVIRONMENT}
      - CHOKIDAR_USEPOLLING=true
      - FAST_REFRESH=false
      - GENERATE_SOURCEMAP=false
      - DISABLE_ESLINT_PLUGIN=true
      - TSC_COMPILE_ON_ERROR=true
      - WATCHPACK_POLLING=true
    volumes:
      - ./web-app/src:/app/src
      - ./web-app/public:/app/public
    command: sh -lc "npm run build && node scripts/serve-build.js"
    depends_on:
      tenant-service:
        condition: service_healthy
    networks:
      - medicore-network

  ehr-frontend:
    build:
      context: ./ehr-frontend
      dockerfile: Dockerfile.dev
    container_name: medicore-ehr-frontend
    ports:
      - "${PORT_EHR_FRONTEND}:3000"
    environment:
      - PORT=3000
      - REACT_APP_API_URL=${REACT_APP_API_URL}
      - REACT_APP_API_BASE_URL=${REACT_APP_API_BASE_URL}
      - REACT_APP_TENANT_API_PATH=${REACT_APP_TENANT_API_PATH}
      - REACT_APP_EHR_API_PATH=${REACT_APP_EHR_API_PATH}
      - REACT_APP_CDSS_API_PATH=${REACT_APP_CDSS_API_PATH}
      - REACT_APP_EHR_API_URL=${REACT_APP_EHR_API_URL}
      - REACT_APP_TENANT_API_URL=${REACT_APP_TENANT_API_URL}
      - REACT_APP_CDSS_API_URL=${REACT_APP_CDSS_API_URL}
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=1000
      - FAST_REFRESH=true
      - GENERATE_SOURCEMAP=false
      - DISABLE_ESLINT_PLUGIN=true
      - TSC_COMPILE_ON_ERROR=true
      - WATCHPACK_POLLING=true
      - WDS_SOCKET_HOST=0.0.0.0
      - WDS_SOCKET_PORT=3000
      - WDS_SOCKET_URL=${REACT_APP_WS_URL}
      - REACT_APP_CHOKIDAR_USEPOLLING=true
      - BROWSER=none
    volumes:
      - ./ehr-frontend/src:/app/src
      - ./ehr-frontend/public:/app/public
      - ./ehr-frontend/package.json:/app/package.json
      - ./ehr-frontend/package-lock.json:/app/package-lock.json
      - ./ehr-frontend/tsconfig.json:/app/tsconfig.json
      - ./ehr-frontend/tailwind.config.js:/app/tailwind.config.js
      - ./ehr-frontend/postcss.config.js:/app/postcss.config.js
    depends_on:
      - tenant-service
      - ehr-service
    networks:
      - medicore-network

  patient-portal:
    build:
      context: ./patient-portal
      dockerfile: Dockerfile.dev
    container_name: medicore-patient-portal
    ports:
      - "${PORT_PATIENT_PORTAL:-3015}:3015"
    environment:
      - PORT=3015
      - REACT_APP_API_BASE_URL=${REACT_APP_API_BASE_URL}
      - REACT_APP_EHR_API_PATH=${REACT_APP_EHR_API_PATH}
      - REACT_APP_EHR_API_URL=${REACT_APP_EHR_API_URL}
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=1000
      - FAST_REFRESH=true
      - GENERATE_SOURCEMAP=false
      - DISABLE_ESLINT_PLUGIN=true
      - TSC_COMPILE_ON_ERROR=true
      - WATCHPACK_POLLING=true
      - WDS_SOCKET_HOST=0.0.0.0
      - WDS_SOCKET_PORT=3015
      - REACT_APP_CHOKIDAR_USEPOLLING=true
      - BROWSER=none
    volumes:
      - ./patient-portal/src:/app/src
      - ./patient-portal/public:/app/public
      - ./patient-portal/package.json:/app/package.json
      - ./patient-portal/package-lock.json:/app/package-lock.json
      - ./patient-portal/tsconfig.json:/app/tsconfig.json
      - ./patient-portal/tailwind.config.js:/app/tailwind.config.js
      - ./patient-portal/postcss.config.js:/app/postcss.config.js
    depends_on:
      - ehr-service
    networks:
      - medicore-network

  # Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: medicore-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - medicore-network

  grafana:
    image: grafana/grafana:latest
    container_name: medicore-grafana
    ports:
      - "3012:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - medicore-network

volumes:
  postgres_master_data:
  redis_data:
  minio_data:
  grafana_data:

networks:
  medicore-network:
    driver: bridge
