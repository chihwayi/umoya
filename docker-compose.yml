version: '3.8'

services:
  # Databases
  postgres-master:
    image: postgres:15-alpine
    container_name: medicore-postgres-master
    environment:
      POSTGRES_DB: medicore_master
      POSTGRES_USER: medicore
      POSTGRES_PASSWORD: medicore_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_master_data:/var/lib/postgresql/data
      - ./database/schemas/tenant.sql:/docker-entrypoint-initdb.d/01-tenant.sql
    networks:
      - medicore-network

  redis:
    image: redis:7-alpine
    container_name: medicore-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - medicore-network

  minio:
    image: minio/minio:RELEASE.2023-10-07T15-07-38Z
    container_name: medicore-minio
    environment:
      - MINIO_ROOT_USER=medicore
      - MINIO_ROOT_PASSWORD=medicore_password
    command: server --console-address ":9001" /data
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - medicore-network

  # Core Services
  tenant-service:
    build:
      context: ./services/tenant-service
      dockerfile: Dockerfile
    container_name: medicore-tenant-service
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - PORT=3001
      - DATABASE_URL=postgresql://medicore:medicore_password@postgres-master:5432/medicore_master
      - REDIS_URL=redis://redis:6379
      - DB_HOST=postgres-master
      - DB_PORT=5432
      - DB_USERNAME=medicore
      - DB_PASSWORD=medicore_password
    depends_on:
      - postgres-master
      - redis
    networks:
      - medicore-network

  cdss-service:
    build:
      context: ./services/cdss-service
      dockerfile: Dockerfile
    container_name: medicore-cdss-service
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - REDIS_URL=redis://redis:6379
      - PYTHONUNBUFFERED=1
      - CDSS_ENABLE_AI=true
    depends_on:
      - redis
      - postgres-master
    networks:
      - medicore-network
    volumes:
      - ./services/cdss-service:/app

  ehr-service:
    build:
      context: ./services/ehr-service
      dockerfile: Dockerfile
    container_name: medicore-ehr-service
    ports:
      - "3013:3013"
    environment:
      - NODE_ENV=development
      - PORT=3013
      - DB_HOST=postgres-master
      - DB_PORT=5432
      - DB_USERNAME=medicore
      - DB_PASSWORD=medicore_password
      - JWT_SECRET=ehr-super-secret-key
      - SNOMED_USE_POSTGRES=true
      - SNOMED_USE_CACHE=false
      - CDSS_SERVICE_URL=http://cdss-service:8000
      - STORAGE_DRIVER=s3
      - STORAGE_S3_ENDPOINT=http://minio:9000
      - STORAGE_S3_REGION=us-east-1
      - STORAGE_S3_BUCKET=medicore-imaging
      - STORAGE_S3_ACCESS_KEY=medicore
      - STORAGE_S3_SECRET_KEY=medicore_password
      - STORAGE_S3_FORCE_PATH_STYLE=true
      - STORAGE_S3_USE_SSL=false
      - STORAGE_S3_PUBLIC_BASE_URL=http://localhost:9000
    volumes:
      - ./services/ehr-service/src:/app/src
      - ./services/ehr-service/package.json:/app/package.json
      - ./services/ehr-service/who-smart-guidelines:/app/who-smart-guidelines
    depends_on:
      - postgres-master
      - cdss-service
      - minio
    networks:
      - medicore-network

  # Frontends
  web-app:
    build:
      context: ./web-app
      dockerfile: Dockerfile.dev
    container_name: medicore-web-app
    ports:
      - "3011:3011"
    environment:
      - PORT=3011
      - REACT_APP_API_URL=/api
      - REACT_APP_ENVIRONMENT=development
      - CHOKIDAR_USEPOLLING=true
      - FAST_REFRESH=false
      - GENERATE_SOURCEMAP=false
      - DISABLE_ESLINT_PLUGIN=true
      - TSC_COMPILE_ON_ERROR=true
      - WATCHPACK_POLLING=true
    volumes:
      - ./web-app/src:/app/src
      - ./web-app/public:/app/public
    depends_on:
      - tenant-service
    networks:
      - medicore-network

  ehr-frontend:
    build:
      context: ./ehr-frontend
      dockerfile: Dockerfile.dev
    container_name: medicore-ehr-frontend
    ports:
      - "3014:3000"
    environment:
      - PORT=3000
      - REACT_APP_API_URL=http://localhost:3001/api
      - REACT_APP_EHR_API_URL=http://localhost:3013/api
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=1000
      - FAST_REFRESH=true
      - GENERATE_SOURCEMAP=false
      - DISABLE_ESLINT_PLUGIN=true
      - TSC_COMPILE_ON_ERROR=true
      - WATCHPACK_POLLING=true
      - WDS_SOCKET_HOST=0.0.0.0
      - WDS_SOCKET_PORT=3000
      - REACT_APP_CHOKIDAR_USEPOLLING=true
      - BROWSER=none
    volumes:
      - ./ehr-frontend/src:/app/src
      - ./ehr-frontend/public:/app/public
      - ./ehr-frontend/package.json:/app/package.json
      - ./ehr-frontend/package-lock.json:/app/package-lock.json
      - ./ehr-frontend/tsconfig.json:/app/tsconfig.json
      - ./ehr-frontend/tailwind.config.js:/app/tailwind.config.js
      - ./ehr-frontend/postcss.config.js:/app/postcss.config.js
    depends_on:
      - tenant-service
      - ehr-service
    networks:
      - medicore-network

  patient-portal:
    build:
      context: ./patient-portal
      dockerfile: Dockerfile.dev
    container_name: medicore-patient-portal
    ports:
      - "3015:3015"
    environment:
      - PORT=3015
      - REACT_APP_EHR_API_URL=http://localhost:3013/api
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=1000
      - FAST_REFRESH=true
      - GENERATE_SOURCEMAP=false
      - DISABLE_ESLINT_PLUGIN=true
      - TSC_COMPILE_ON_ERROR=true
      - WATCHPACK_POLLING=true
      - WDS_SOCKET_HOST=0.0.0.0
      - WDS_SOCKET_PORT=3015
      - REACT_APP_CHOKIDAR_USEPOLLING=true
      - BROWSER=none
    volumes:
      - ./patient-portal/src:/app/src
      - ./patient-portal/public:/app/public
      - ./patient-portal/package.json:/app/package.json
      - ./patient-portal/package-lock.json:/app/package-lock.json
      - ./patient-portal/tsconfig.json:/app/tsconfig.json
      - ./patient-portal/tailwind.config.js:/app/tailwind.config.js
      - ./patient-portal/postcss.config.js:/app/postcss.config.js
    depends_on:
      - ehr-service
    networks:
      - medicore-network

  # Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: medicore-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - medicore-network

  grafana:
    image: grafana/grafana:latest
    container_name: medicore-grafana
    ports:
      - "3012:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - medicore-network

volumes:
  postgres_master_data:
  redis_data:
  minio_data:
  grafana_data:

networks:
  medicore-network:
    driver: bridge
