name: MediCore CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [ehr-service, tenant-service]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18.x'
        # cache: 'npm' # Uncomment if package-lock.json exists and is committed
        # cache-dependency-path: services/${{ matrix.service }}/package-lock.json

    - name: Install Dependencies
      working-directory: services/${{ matrix.service }}
      run: npm install

    - name: Build
      working-directory: services/${{ matrix.service }}
      run: npm run build

    - name: Test
      working-directory: services/${{ matrix.service }}
      run: npm test

    - name: Send mail on failure
      if: failure()
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: ${{ secrets.SMTP_HOST }}
        server_port: ${{ secrets.SMTP_PORT }}
        username: ${{ secrets.SMTP_USERNAME }}
        password: ${{ secrets.SMTP_PASSWORD }}
        subject: GitHub Actions Job Failed - ${{ github.repository }}
        body: |
          The job "${{ github.job }}" in workflow "${{ github.workflow }}" of "${{ github.repository }}" has failed.
          
          Commit: ${{ github.sha }}
          Author: ${{ github.actor }}
          
          Check the logs here: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        to: ${{ secrets.NOTIFICATION_EMAIL }}
        from: GitHub Actions <${{ secrets.SMTP_USERNAME }}>
