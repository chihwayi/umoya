name: MediCore CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: ehr-service
            path: services/ehr-service
          - service: tenant-service
            path: services/tenant-service
          - service: ehr-frontend
            path: ehr-frontend

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18.x'
        # cache: 'npm' # Uncomment if package-lock.json exists and is committed
        # cache-dependency-path: ${{ matrix.path }}/package-lock.json

    - name: Install Dependencies
      run: npm install

    - name: Build Shared Config
      run: npm run build -w @medicore/config

    - name: Build
      working-directory: ${{ matrix.path }}
      run: npm run build

    - name: Test
      working-directory: ${{ matrix.path }}
      run: npm test

    - name: Send mail on failure
      if: failure() && env.NOTIFICATION_EMAIL != '' && env.SMTP_HOST != '' && env.SMTP_PORT != '' && env.SMTP_USERNAME != '' && env.SMTP_PASSWORD != ''
      uses: dawidd6/action-send-mail@v3
      continue-on-error: true
      env:
        SMTP_HOST: ${{ secrets.SMTP_HOST }}
        SMTP_PORT: ${{ secrets.SMTP_PORT }}
        SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
        SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
      with:
        server_address: ${{ env.SMTP_HOST }}
        server_port: ${{ env.SMTP_PORT }}
        username: ${{ env.SMTP_USERNAME }}
        password: ${{ env.SMTP_PASSWORD }}
        subject: GitHub Actions Job Failed - ${{ github.repository }}
        body: |
          The job "${{ github.job }}" in workflow "${{ github.workflow }}" of "${{ github.repository }}" has failed.
          
          Commit: ${{ github.sha }}
          Author: ${{ github.actor }}
          
          Check the logs here: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        to: ${{ env.NOTIFICATION_EMAIL }}
        from: GitHub Actions <${{ env.SMTP_USERNAME }}>
