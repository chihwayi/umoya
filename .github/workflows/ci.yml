name: Umoya CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: ehr-service
            path: services/ehr-service
          - service: tenant-service
            path: services/tenant-service
          - service: ehr-frontend
            path: ehr-frontend
          - service: patient-portal
            path: patient-portal

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18.x'
        # cache: 'npm' # Uncomment if package-lock.json exists and is committed
        # cache-dependency-path: ${{ matrix.path }}/package-lock.json

    - name: Install Dependencies
      run: npm install

    - name: Build Shared Config
      run: npm run build -w @umoya/config

    - name: Use Python
      if: matrix.service == 'ehr-service'
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python Test Runner
      if: matrix.service == 'ehr-service'
      run: python -m pip install pytest

    - name: Run CDSS Offline Safety Gates
      if: matrix.service == 'ehr-service'
      run: |
        PYTHONPATH=services/cdss-service python -m pytest -q \
          services/cdss-service/tests/test_offline_clinical_eval_harness.py \
          services/cdss-service/tests/test_ai_governance.py \
          services/cdss-service/tests/test_outbound_guard.py \
          services/cdss-service/tests/test_clinical_safety.py

    - name: Enforce Frontend CDSS Proxy Boundary
      if: matrix.service == 'ehr-frontend'
      working-directory: ${{ matrix.path }}
      run: npm run check:proxy-only

    - name: Enforce Frontend Changed-Files Lint (Blocking)
      if: matrix.service == 'ehr-frontend'
      working-directory: ${{ matrix.path }}
      run: npm run lint:changed:strict

    - name: Enforce Doctor Frontend Changed-Files Lint (Blocking)
      if: matrix.service == 'ehr-frontend'
      working-directory: ${{ matrix.path }}
      run: npm run lint:doctor:changed:strict

    - name: Lint
      if: matrix.service == 'patient-portal' || matrix.service == 'tenant-service' || matrix.service == 'ehr-service'
      working-directory: ${{ matrix.path }}
      run: npm run lint --if-present

    - name: Build
      working-directory: ${{ matrix.path }}
      run: npm run build

    - name: Test
      working-directory: ${{ matrix.path }}
      run: npm test

    - name: Red-team adversarial suite (release gate)
      if: matrix.service == 'ehr-service'
      working-directory: ${{ matrix.path }}
      run: npx jest red-team.adversarial.spec.ts --passWithNoTests

    - name: SOC2/HIPAA evidence report (stub)
      if: matrix.service == 'ehr-service'
      run: node scripts/soc2-hipaa-evidence-report.js

    - name: Send mail on failure
      if: failure() && env.NOTIFICATION_EMAIL != '' && env.SMTP_HOST != '' && env.SMTP_PORT != '' && env.SMTP_USERNAME != '' && env.SMTP_PASSWORD != ''
      uses: dawidd6/action-send-mail@v3
      continue-on-error: true
      env:
        SMTP_HOST: ${{ secrets.SMTP_HOST }}
        SMTP_PORT: ${{ secrets.SMTP_PORT }}
        SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
        SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
      with:
        server_address: ${{ env.SMTP_HOST }}
        server_port: ${{ env.SMTP_PORT }}
        username: ${{ env.SMTP_USERNAME }}
        password: ${{ env.SMTP_PASSWORD }}
        subject: GitHub Actions Job Failed - ${{ github.repository }}
        body: |
          The job "${{ github.job }}" in workflow "${{ github.workflow }}" of "${{ github.repository }}" has failed.
          
          Commit: ${{ github.sha }}
          Author: ${{ github.actor }}
          
          Check the logs here: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        to: ${{ env.NOTIFICATION_EMAIL }}
        from: GitHub Actions <${{ env.SMTP_USERNAME }}>

  tenant-provisioning-smoke:
    name: Tenant Provisioning Smoke Test
    runs-on: ubuntu-latest
    needs: build-and-test

    services:
      postgres:
        # Must match the production image (docker-compose postgres-master) so
        # the pgvector "vector" extension is available for sprint114_clinical_rag.
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SMOKE_DB_HOST: localhost
      SMOKE_DB_PORT: 5432
      SMOKE_DB_USER: postgres
      SMOKE_DB_PASSWORD: postgres
      SMOKE_DB_NAME: postgres

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18.x'

    - name: Install Dependencies
      working-directory: services/tenant-service
      run: npm install

    - name: Build Shared Config
      run: npm run build -w @umoya/config

    - name: Run Provisioning Smoke Test
      working-directory: services/tenant-service
      run: npm run test:smoke

  mobile-quality-gates:
    name: Mobile Quality Gates
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'

    - name: Install Mobile Dependencies
      working-directory: mobile
      run: npm install

    - name: Mobile Lint
      working-directory: mobile
      run: npm run lint --if-present

    - name: Mobile Release Version Check
      working-directory: mobile
      run: npm run release:check --if-present

    - name: Mobile Beta Readiness Check
      working-directory: mobile
      run: npm run beta:check --if-present

    - name: Mobile Typecheck
      working-directory: mobile
      run: npx tsc --noEmit

    - name: Mobile Unit Tests
      working-directory: mobile
      run: npm run test --if-present

    - name: Expo Doctor
      working-directory: mobile
      run: npx expo-doctor

    - name: Mobile E2E Smoke
      # Requires a booted Android emulator (AVD). Opt-in by setting
      # MOBILE_E2E_ENABLED = 'true' in repo Variables (Settings → Variables).
      if: vars.MOBILE_E2E_ENABLED == 'true'
      working-directory: mobile
      run: npm run test:e2e

  playwright-e2e:
    name: Playwright E2E (Staging)
    runs-on: ubuntu-latest
    needs: build-and-test
    # Opt-in: set STAGING_E2E_ENABLED = 'true' in repo Variables (Settings → Secrets and variables → Variables)
    if: vars.STAGING_E2E_ENABLED == 'true'
    env:
      EHR_API_URL: ${{ secrets.STAGING_EHR_API_URL }}
      EHR_SERVICE_URL: ${{ secrets.STAGING_EHR_SERVICE_URL }}
      STAGING_EHR_QA_TENANT: ${{ secrets.STAGING_EHR_QA_TENANT }}
      STAGING_EHR_QA_TOKEN: ${{ secrets.STAGING_EHR_QA_TOKEN }}
      CI: true

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18.x'

    - name: Install Playwright deps
      working-directory: qa/tests
      run: npm install

    - name: Install Playwright browsers
      working-directory: qa/tests
      run: npx playwright install --with-deps chromium

    - name: Run Playwright E2E tests
      working-directory: qa/tests
      run: npx playwright test

    - name: Upload Playwright report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report-${{ github.run_id }}
        path: qa/tests/playwright-report/
        retention-days: 14

    - name: Upload test results JSON
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-results-${{ github.run_id }}
        path: qa/tests/test-results/results.json
        retention-days: 14

  deploy:
    name: Deploy to Production VPS
    runs-on: ubuntu-latest
    needs: [build-and-test, mobile-quality-gates]
    # Opt-in: set DEPLOY_ENABLED = 'true' in repo Variables to activate CD
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    environment: production

    steps:
    - uses: actions/checkout@v4

    - name: Validate secrets before deploy
      run: bash scripts/validate-secrets.sh
      env:
        POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        JWT_SECRET: ${{ secrets.JWT_SECRET }}
        MINIO_ROOT_PASSWORD: ${{ secrets.MINIO_ROOT_PASSWORD }}
        CDSS_SERVICE_TOKEN: ${{ secrets.CDSS_SERVICE_TOKEN }}
        CDSS_SERVICE_JWT_SECRET: ${{ secrets.CDSS_SERVICE_JWT_SECRET }}
        CDSS_ENCRYPTION_KEY: ${{ secrets.CDSS_ENCRYPTION_KEY }}
        ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
        GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
        POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
        POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
        CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
        SERVICE_POSTGRES_HOST: ${{ secrets.SERVICE_POSTGRES_HOST }}
        SERVICE_REDIS_URL: ${{ secrets.SERVICE_REDIS_URL }}
        SERVICE_MINIO_URL: ${{ secrets.SERVICE_MINIO_URL }}
        MINIO_ROOT_USER: ${{ secrets.MINIO_ROOT_USER }}

    - name: Set up SSH
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

    - name: Add VPS to known hosts
      run: |
        ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

    - name: Deploy via SSH
      run: |
        ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" << 'ENDSSH'
          set -euo pipefail
          cd "${{ secrets.VPS_DEPLOY_PATH }}"
          echo "Pulling latest code..."
          git pull origin main
          echo "Pre-pulling images..."
          docker compose -f docker-compose.prod.yml pull --ignore-pull-failures || true
          echo "Restarting services..."
          docker compose -f docker-compose.prod.yml up -d --build --remove-orphans
          echo "Pruning unused images..."
          docker image prune -f
          echo "Deploy complete."
        ENDSSH

    - name: Health check after deploy
      run: |
        sleep 30
        curl -sf --max-time 15 "https://${{ secrets.VPS_HOST }}/health" || \
          echo "Warning: health check failed — check service logs"

    - name: Send deploy notification on failure
      if: failure() && env.NOTIFICATION_EMAIL != '' && env.SMTP_HOST != ''
      uses: dawidd6/action-send-mail@v3
      continue-on-error: true
      env:
        SMTP_HOST: ${{ secrets.SMTP_HOST }}
        SMTP_PORT: ${{ secrets.SMTP_PORT }}
        SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
        SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
      with:
        server_address: ${{ env.SMTP_HOST }}
        server_port: ${{ env.SMTP_PORT }}
        username: ${{ env.SMTP_USERNAME }}
        password: ${{ env.SMTP_PASSWORD }}
        subject: "DEPLOY FAILED — ${{ github.repository }} @ ${{ github.sha }}"
        body: |
          Production deploy failed for ${{ github.repository }}.
          Commit: ${{ github.sha }} by ${{ github.actor }}
          Logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        to: ${{ env.NOTIFICATION_EMAIL }}
        from: GitHub Actions <${{ env.SMTP_USERNAME }}>
