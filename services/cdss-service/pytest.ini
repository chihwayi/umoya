[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
; B-013/MOAS-18: tests import top-level modules (main, ai_governance,
; ai_models, ...) as if run from the service root. Without this, pytest only
; puts each test file's own directory on sys.path, so every test module that
; imports application code fails collection with ModuleNotFoundError unless
; the caller manually sets PYTHONPATH — making the suite non-reproducible
; across different invocation environments (host shell, CI, container exec).
pythonpath = .
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

