buildscript {
    ext {
        buildToolsVersion = "33.0.0"
        minSdkVersion = 21
        compileSdkVersion = 33
        targetSdkVersion = 33
        ndkVersion = "23.1.7779620"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:7.4.2")
        // Use the pre-built React Native Gradle plugin JAR from monorepo
        // The plugin's dependencies (gson, guava, javapoet) will be resolved from maven
        classpath(files("../../node_modules/@react-native/gradle-plugin/build/libs/react-native-gradle-plugin.jar"))
        classpath("com.google.code.gson:gson:2.8.9")
        classpath("com.google.guava:guava:31.0.1-jre")
        classpath("com.squareup:javapoet:1.13.0")
    }
}

allprojects {
    repositories {
        maven {
            // React Native is in mobile-app/node_modules (not hoisted)
            url("$rootDir/../node_modules/react-native/android")
        }
        maven {
            // jsc-android is hoisted to root node_modules
            url("$rootDir/../../node_modules/jsc-android/dist")
        }
        google()
        mavenCentral()
    }
}