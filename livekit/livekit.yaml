# Self-hosted LiveKit server config — non-secret settings only.
# API keys are injected separately via the LIVEKIT_KEYS env var
# (docker-compose.yml), never committed here.
port: 7880
rtc:
  tcp_port: 7881
  port_range_start: 50100
  port_range_end: 50200
  use_external_ip: true
redis:
  address: redis:6379
